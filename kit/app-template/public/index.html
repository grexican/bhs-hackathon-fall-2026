<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{name}}</title>
  <!-- "Add to Home Screen" on phones (does nothing until LOCKER_INSTALL is set; see make-it-an-app). Keep it in <head>. -->
  <script src="/locker/install.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- The starting page. /start replaces this with your real app. -->
  <main>
    <h1>{{name}}</h1>
    <p>Your app is running. Tap the button: the count is saved in the database, so it stays after a restart.</p>
    <button id="tap" type="button">Tap me</button>
    <p class="count"><span id="count">…</span> taps so far</p>
    <p id="hello" class="hello"></p>
    <!-- A "Turn on notifications" button (/push-notifications). To turn it on, delete the comment marks around
         the next line AND around the push.js line at the bottom. Before /connect the notifications are simulated. -->
    <!-- <button type="button" data-push-button>Turn on notifications</button> -->
    <!-- A hint for you, the builder: both are one line each at the bottom of this file. Delete this line when your real page is here. -->
    <p class="starter-hint">Turn on: <b>Ask the AI</b> · <b>Feedback button</b> · <b>Notifications</b> (in public/index.html)</p>
  </main>
  <script type="module" src="/app.js"></script>
  <!-- An "Ask the AI" box (public/ask.js, the AI call is in server.js). To turn it on, delete the comment marks around the next line.
       Before /connect it answers with a labelled simulated reply; online it uses the app's monthly AI budget. -->
  <!-- <script type="module" src="/ask.js"></script> -->
  <!-- A "Feedback" button for testers (/test-with-a-friend). To turn it on, delete the comment marks around the next line. -->
  <!-- <script src="/locker/feedback.js" defer></script> -->
  <!-- The notifications button's code (locker/push.js). Delete the comment marks around the next line too. -->
  <!-- <script src="/locker/push.js" defer></script> -->
</body>
</html>
